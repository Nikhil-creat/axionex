name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install light test dependencies
        working-directory: backend
        run: pip install numpy pytest pydantic pydantic-settings
      - name: Unit tests (pricing, forecasting, simulation, bandit, resilience)
        working-directory: backend
        run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Type-check and build
        working-directory: frontend
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build
